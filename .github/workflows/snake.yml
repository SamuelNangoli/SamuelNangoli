name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SamuelNangoli
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#FFAA00&color_dots=#161B22,#0E4429,#006D32,#26A641,#00E676
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#FFAA00

      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
